name: macOS Swift Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Compile and run native unit tests
        run: swift test
      - name: Compile optimized native SwiftUI application
        run: swift build -c release --product NodePocketApp
      - name: Validate packaging shell syntax (no credentials or binaries)
        run: bash -n scripts/build_app.sh scripts/build_dmg.sh scripts/fetch-verify-knots.sh scripts/build_production_dmg.sh
      - name: Smoke-build ad-hoc app bundle with pinned Knots (no publication or deployment)
        env:
          SENTINEL_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/build_app.sh
          codesign --verify --strict --deep "dist/Sentinel Node Wallet.app"
          plutil -lint "dist/Sentinel Node Wallet.app/Contents/Info.plist"
          test -s "dist/BUILD_MANIFEST.json"
      - name: Isolated Knots encrypted descriptor wallet backup and restore (CI only)
        run: |
          # This always starts its own isolated regtest daemon and datadir on
          # GitHub's ephemeral macOS worker; no operator MainNet data is mounted.
          bash Tests/integration/test_knots_regtest_roundtrip.sh
