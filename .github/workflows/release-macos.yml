name: macOS Production Release & Sparkle Deployment

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git release tag to publish (e.g. v1.0.0-build5)'
        required: true
        type: string
      operator_approval_confirmed:
        description: 'Explicit human operator release approval confirmation (type YES to confirm)'
        required: true
        type: string
        default: 'NO'
      release_phase:
        description: 'Release Phase: "stage-draft" (Phase A: Build, sign, notarize, stage draft release), "promote-feed" (Phase B: Promote draft to public, stage feed branch), or "verify-deployed" (Phase C: Verify deployed feed on main post-merge)'
        required: true
        type: choice
        default: 'stage-draft'
        options:
          - 'stage-draft'
          - 'promote-feed'
          - 'verify-deployed'
      is_draft:
        description: 'Legacy parameter: set true for stage-draft, false for promote-feed'
        required: false
        type: boolean
        default: true
      is_prerelease:
        description: 'Publish release as a Pre-release (Beta channel)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release-macos
  cancel-in-progress: false

jobs:
  unprivileged-qualification:
    name: Unprivileged Build Qualification & Gating
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verified_tag: ${{ steps.validate_tag.outputs.verified_tag }}
      short_version: ${{ steps.validate_tag.outputs.short_version }}
      build_number: ${{ steps.validate_tag.outputs.build_number }}
      effective_phase: ${{ steps.validate_tag.outputs.effective_phase }}
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0

      - name: Display Swift toolchain
        run: swift --version

      # Gating Stage 1: Validate Release Tag and Operator Release Authorization (Fail-Closed)
      - name: Validate Release Tag and Operator Release Authorization
        id: validate_tag
        env:
          INPUT_TAG: "${{ github.event.inputs.tag_name }}"
          OPERATOR_APPROVAL: "${{ github.event.inputs.operator_approval_confirmed }}"
          INPUT_PHASE: "${{ github.event.inputs.release_phase }}"
          IS_DRAFT_INPUT: "${{ github.event.inputs.is_draft }}"
        run: |
          if [ "${OPERATOR_APPROVAL}" != "YES" ]; then
            echo "ERROR: Operator release authorization missing or invalid. Received '${OPERATOR_APPROVAL}', expected 'YES'." >&2
            exit 1
          fi

          if [ -z "${INPUT_TAG}" ]; then
            echo "ERROR: Target release tag cannot be empty." >&2
            exit 1
          fi

          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$'
          if ! [[ "${INPUT_TAG}" =~ ${TAG_REGEX} ]]; then
            echo "ERROR: Release tag '${INPUT_TAG}' does not match required format: ^v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$" >&2
            exit 1
          fi

          VERSION="${INPUT_TAG#v}"
          VERSION="${VERSION%%-build*}"
          BUILD_NUM="${INPUT_TAG##*-build}"

          if [ "${BUILD_NUM}" -le 3 ]; then
            echo "ERROR: Build number ${BUILD_NUM} must be greater than 3 to maintain monotonic sequence (Build 3 is published)." >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${INPUT_TAG}" 2>/dev/null || echo "")"
          if [ -z "${TAG_COMMIT}" ]; then
            echo "ERROR: Release tag '${INPUT_TAG}' does not exist in repository git history." >&2
            exit 1
          fi

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "ERROR: Target tag commit (${TAG_COMMIT}) does not match current HEAD commit (${HEAD_COMMIT})." >&2
            exit 1
          fi

          EFFECTIVE_PHASE="${INPUT_PHASE}"
          if [ -z "${EFFECTIVE_PHASE}" ]; then
            if [ "${IS_DRAFT_INPUT}" = "false" ]; then
              EFFECTIVE_PHASE="promote-feed"
            else
              EFFECTIVE_PHASE="stage-draft"
            fi
          fi

          echo "verified_tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "effective_phase=${EFFECTIVE_PHASE}" >> "$GITHUB_OUTPUT"
          echo "Operator release approval and tag validation passed: ${INPUT_TAG} (v${VERSION} build ${BUILD_NUM}) [Phase: ${EFFECTIVE_PHASE}] -> ${HEAD_COMMIT}"

      # Gating Stage 2: Full Automated Test Suite
      - name: Run native unit tests
        run: swift test

      # Gating Stage 3: Verify Release Broadcast Lock & Purge Safety (WO-25, WO-39, WO-44, WO-59)
      - name: Verify release broadcast lock and spend gate enforcement
        run: swift run -c release VerifyReleaseBroadcastLock

      # Gating Stage 4: Packaging Shell Syntax Validation
      - name: Validate script syntax
        run: |
          bash -n scripts/build_app.sh \
                  scripts/build_dmg.sh \
                  scripts/build_production_dmg.sh \
                  scripts/sign_appcast_enclosure.sh \
                  scripts/publish_production_appcast.sh \
                  scripts/fetch-verify-knots.sh \
                  scripts/package_appstore_archive.sh

      # Gating Stage 5: Verify Bitcoin Knots Binary Provenance
      - name: Cache & verify official Bitcoin Knots binaries
        run: bash scripts/fetch-verify-knots.sh

  # =========================================================================
  # Phase A: Privileged Signing, Notarization & Draft Release Staging (WO-115)
  # =========================================================================
  stage-candidate-draft:
    name: "Phase A: Privileged Signing, Notarization & Draft Release Staging (WO-115)"
    needs: unprivileged-qualification
    if: needs.unprivileged-qualification.outputs.effective_phase == 'stage-draft'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unprivileged-qualification.outputs.verified_tag }}
          fetch-depth: 0

      # Gating Stage 6: Environment & Secrets Verification (Fail-Closed)
      - name: Verify production signing prerequisites (Fail-Closed)
        env:
          APPLE_CERT_B64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
          APPLE_CERT_PASS: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          NOTARY_KEY_B64: "${{ secrets.NOTARY_API_KEY_BASE64 }}"
          NOTARY_KEY_ID: "${{ secrets.NOTARY_KEY_ID }}"
          NOTARY_ISSUER_ID: "${{ secrets.NOTARY_ISSUER_ID }}"
          SPARKLE_PRIV_KEY: "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}"
          SPARKLE_PUB_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          MISSING=""
          if [ -z "${APPLE_CERT_B64}" ] || [ -z "${APPLE_CERT_PASS}" ]; then
            MISSING="${MISSING} APPLE_CERTIFICATE"
          fi
          if [ -z "${NOTARY_KEY_B64}" ] || [ -z "${NOTARY_KEY_ID}" ] || [ -z "${NOTARY_ISSUER_ID}" ]; then
            MISSING="${MISSING} NOTARY_CREDENTIALS"
          fi
          if [ -z "${SPARKLE_PRIV_KEY}" ]; then
            MISSING="${MISSING} SPARKLE_PRIVATE_KEY"
          fi
          if [ -z "${SPARKLE_PUB_KEY}" ]; then
            MISSING="${MISSING} SPARKLE_PUBLIC_KEY"
          fi

          if [ -n "${MISSING}" ]; then
            echo "ERROR: Production release blocked fail-closed. Missing mandatory signing credentials:${MISSING}." >&2
            echo "Official production distribution requires an Apple Developer ID Application certificate, Apple Notary credentials, and Sparkle Ed25519 keypair." >&2
            exit 1
          fi

          # Strict validation of SPARKLE_PUB_KEY format (valid Base64 decoding to 32 bytes, WO-122-R4)
          python3 - "${SPARKLE_PUB_KEY}" <<'PY' || exit 1
          import base64, sys
          k = sys.argv[1].strip()
          try:
              raw = base64.b64decode(k, validate=True)
              if len(raw) != 32:
                  print(f"ERROR: SPARKLE_PUBLIC_ED_KEY decoded length is {len(raw)} bytes (expected 32 bytes).", file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f"ERROR: SPARKLE_PUBLIC_ED_KEY is not valid Base64: {e}", file=sys.stderr)
              sys.exit(1)
          print("✓ Verified SPARKLE_PUBLIC_ED_KEY format: valid 32-byte Ed25519 public key.")
          PY

      # Configure Ephemeral Keychain for Developer ID Application
      - name: Configure ephemeral keychain and Developer ID identity
        env:
          CERT_BASE64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
          CERT_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          CERT_FILE="${RUNNER_TEMP}/cert.p12"
          echo "${CERT_BASE64}" | base64 --decode > "${CERT_FILE}"
          security import "${CERT_FILE}" -k "${KEYCHAIN_PATH}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          rm -f "${CERT_FILE}"

      # Configure Apple Notary Service Credentials
      - name: Configure Apple Notary credentials
        env:
          KEY_BASE64: "${{ secrets.NOTARY_API_KEY_BASE64 }}"
          KEY_ID: "${{ secrets.NOTARY_KEY_ID }}"
          ISSUER_ID: "${{ secrets.NOTARY_ISSUER_ID }}"
        run: |
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${KEY_ID}.p8"
          echo "${KEY_BASE64}" | base64 --decode > "${API_KEY_PATH}"
          xcrun notarytool store-credentials "sentinel-notary-profile" \
            --key "${API_KEY_PATH}" \
            --key-id "${KEY_ID}" \
            --issuer "${ISSUER_ID}"
          rm -f "${API_KEY_PATH}"

      # Production Build, Sign, and Notarize (Hardened Runtime, Developer ID, Staple)
      - name: Build, Sign, and Notarize Production DMG
        env:
          SENTINEL_RELEASE_SECURITY_APPROVED: "1"
          SENTINEL_BUNDLE_ID: pool.sentineldefensetechnologies.co.za
          SENTINEL_DEVELOPER_ID_APPLICATION: "${{ secrets.DEVELOPER_ID_APPLICATION_NAME || 'Developer ID Application: Peter Franco' }}"
          SENTINEL_APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID || 'S8QMQZA656' }}"
          SENTINEL_WEBCREDENTIALS_DOMAIN: pool.sentineldefensetechnologies.co.za
          SENTINEL_NOTARY_PROFILE: sentinel-notary-profile
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
          SENTINEL_REQUIRE_SPARKLE_KEY: "1"
          SENTINEL_SHORT_VERSION: "${{ needs.unprivileged-qualification.outputs.short_version }}"
          SENTINEL_BUILD_NUMBER: "${{ needs.unprivileged-qualification.outputs.build_number }}"
        run: |
          bash scripts/build_production_dmg.sh

      # Sparkle Signing & Appcast Enclosure Generation
      - name: Sign DMG with Sparkle EdDSA Key
        env:
          SPARKLE_PRIVATE_ED_KEY: "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}"
        run: |
          DMG_FILE="$(ls -1 dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          bash scripts/sign_appcast_enclosure.sh sign "${DMG_FILE}" --signature-file-output dist/SPARKLE_SIGNATURE.base64 > dist/SPARKLE_ENCLOSURE.txt
          cat dist/SPARKLE_ENCLOSURE.txt
          test -s dist/SPARKLE_SIGNATURE.base64 || { echo "ERROR: dist/SPARKLE_SIGNATURE.base64 is missing or empty." >&2; exit 1; }

      # Generate Authenticated Release Attestation (WO-117, WO-121, WO-122-R3)
      - name: Generate Authenticated Release Attestation
        env:
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          SHORT_VERSION: "${{ needs.unprivileged-qualification.outputs.short_version }}"
          BUILD_NUM: "${{ needs.unprivileged-qualification.outputs.build_number }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}" 2>/dev/null || echo "")"
          if [ -n "${TAG_COMMIT}" ] && [ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "ERROR: Checked-out HEAD (${HEAD_COMMIT}) does not match candidate release tag commit (${TAG_COMMIT})." >&2
            exit 1
          fi

          DMG_FILE="$(ls -1 dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          DMG_NAME="$(basename "${DMG_FILE}")"
          DMG_SHA="$(shasum -a 256 "${DMG_FILE}" | awk '{print $1}')"
          DMG_LEN="$(stat -f%z "${DMG_FILE}" 2>/dev/null || stat -c%s "${DMG_FILE}")"

          if [ ! -f "dist/SPARKLE_SIGNATURE.base64" ]; then
            echo "ERROR: dist/SPARKLE_SIGNATURE.base64 sidecar missing." >&2
            exit 1
          fi
          ED_SIG="$(tr -d '\r\n ' < dist/SPARKLE_SIGNATURE.base64)"

          # Pre-release cryptographic verification of EdDSA signature against DMG bytes (WO-122-R3)
          python3 - "${SPARKLE_PUBLIC_ED_KEY}" "${ED_SIG}" "${DMG_FILE}" <<'PY' || exit 1
          import base64, sys, subprocess

          pub_b64, sig_b64, dmg_path = sys.argv[1:4]

          # Validate Base64 lengths
          try:
              raw_pub = base64.b64decode(pub_b64, validate=True)
              if len(raw_pub) != 32:
                  print(f"ERROR: Decoded public key length is {len(raw_pub)} bytes (expected 32 bytes).", file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f"ERROR: Failed to Base64 decode SPARKLE_PUBLIC_ED_KEY: {e}", file=sys.stderr)
              sys.exit(1)

          try:
              raw_sig = base64.b64decode(sig_b64, validate=True)
              if len(raw_sig) != 64:
                  print(f"ERROR: Decoded signature length is {len(raw_sig)} bytes (expected 64 bytes).", file=sys.stderr)
                  sys.exit(1)
          except Exception as e:
              print(f"ERROR: Failed to Base64 decode ED_SIG: {e}", file=sys.stderr)
              sys.exit(1)

          swift_verify = f"""
          import Foundation
          import CryptoKit

          guard let pubData = Data(base64Encoded: "{pub_b64}"),
                let sigData = Data(base64Encoded: "{sig_b64}"),
                let fileData = try? Data(contentsOf: URL(fileURLWithPath: "{dmg_path}")) else {{
              exit(1)
          }}
          guard let pubKey = try? Curve25519.Signing.PublicKey(rawRepresentation: pubData),
                pubKey.isValidSignature(sigData, for: fileData) else {{
              exit(2)
          }}
          """
          res = subprocess.run(["swift", "-e", swift_verify], capture_output=True)
          if res.returncode != 0:
              print(f"ERROR: Pre-release Swift CryptoKit Ed25519 signature verification failed for {dmg_path}.", file=sys.stderr)
              sys.exit(1)
          print("✓ Pre-release Swift CryptoKit Ed25519 signature verified successfully against exact notarized DMG bytes.")
          PY

          # Verify notarization ticket is actually stapled before recording in attestation (WO-121)
          if xcrun stapler validate "${DMG_FILE}" >/dev/null 2>&1; then
            STAPLED_VAL="True"
          else
            echo "ERROR: Stapler validation failed on notarized DMG." >&2
            exit 1
          fi

          python3 - "${TAG}" "${HEAD_COMMIT}" "${SHORT_VERSION}" "${BUILD_NUM}" "${DMG_NAME}" "${DMG_SHA}" "${DMG_LEN}" "${ED_SIG}" "${SPARKLE_PUBLIC_ED_KEY}" "${STAPLED_VAL}" <<'PY'
          import json, sys
          tag, commit, ver, build, dmg_name, sha, length, sig, pub, stapled = sys.argv[1:11]
          attestation = {
              'schema_version': '1.0',
              'tag': tag,
              'commit_sha': commit,
              'short_version': ver,
              'build_number': build,
              'bundle_id': 'pool.sentineldefensetechnologies.co.za',
              'team_id': 'S8QMQZA656',
              'dmg_filename': dmg_name,
              'dmg_sha256': sha,
              'dmg_length': int(length),
              'sparkle_ed_signature': sig,
              'sparkle_public_ed_key': pub,
              'notary_status': 'Accepted',
              'stapled': stapled == "True",
              'minimum_system_version': '13.0'
          }
          with open('dist/RELEASE_ATTESTATION.json', 'w') as f:
              json.dump(attestation, f, indent=2)
          print('✓ Generated immutable release attestation manifest at dist/RELEASE_ATTESTATION.json')
          PY
          cat dist/RELEASE_ATTESTATION.json

      # Release Asset Upload (Draft Staging Only, WO-108, WO-115, WO-117)
      - name: Create Immutable Draft GitHub Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          IS_PRERELEASE: "${{ github.event.inputs.is_prerelease }}"
        run: |
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on GitHub. Skipping re-creation to maintain immutable asset provenance."
          else
            echo "Creating new draft release for ${TAG}..."
            gh release create "${TAG}" \
              dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg \
              dist/SHA256SUMS.txt \
              dist/BUILD_MANIFEST.json \
              dist/RELEASE_ATTESTATION.json \
              dist/SPARKLE_SIGNATURE.base64 \
              dist/SPARKLE_ENCLOSURE.txt \
              --title "Sentinel Node Wallet (${TAG})" \
              --notes-file docs/RELEASE_NOTES_CANDIDATE.md \
              --draft ${PRERELEASE_FLAG}
          fi

      # Dry-Run Appcast Validation
      - name: Validate Sparkle Feed in Dry-Run Mode
        env:
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          DMG_FILE="$(ls -1 dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          bash scripts/publish_production_appcast.sh \
            --tag "${TAG}" \
            --archive "${DMG_FILE}" \
            --app-bundle "dist/Sentinel Node Wallet.app" \
            --public-key "${SPARKLE_PUBLIC_ED_KEY}" \
            --dry-run
          echo "✓ Draft release staged. Public feed remains untouched until Phase B promotion."

      # Cleanup Credentials
      - name: Clean up ephemeral credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/AuthKey_"*.p8 2>/dev/null || true
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain"
          if [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          fi

  # =========================================================================
  # Phase B: Owner-Approved Public Release Promotion & Feed Cutover (WO-115, WO-117, WO-118)
  # =========================================================================
  promote-public-feed:
    name: "Phase B: Owner-Approved Public Release Promotion & Feed Cutover (WO-115)"
    needs: unprivileged-qualification
    if: needs.unprivileged-qualification.outputs.effective_phase == 'promote-feed'
    runs-on: macos-latest
    timeout-minutes: 20
    environment: production-promotion
    permissions:
      contents: write
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unprivileged-qualification.outputs.verified_tag }}
          fetch-depth: 0

      # Step 0: Ensure Pinned Sparkle Artifacts Available in Fresh Runner (WO-120)
      - name: Ensure Pinned Sparkle Artifacts Available
        run: |
          echo "Populating pinned Sparkle artifacts via swift package resolve..."
          swift package resolve
          SIGN_UPDATE="$(find .build -name "sign_update" -type f -perm +111 2>/dev/null | head -n 1 || true)"
          if [ -z "${SIGN_UPDATE}" ] || [ ! -x "${SIGN_UPDATE}" ]; then
            echo "ERROR: Failed to resolve pinned Sparkle sign_update binary from SPM artifacts." >&2
            exit 1
          fi
          echo "✓ Pinned Sparkle sign_update available at: ${SIGN_UPDATE}"

      # Step 1: Download & Verify Immutable Draft Release Assets (WO-117, WO-120, WO-121)
      - name: Download & Verify Immutable Draft Release Assets
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          SHORT_VERSION: "${{ needs.unprivileged-qualification.outputs.short_version }}"
          BUILD_NUM: "${{ needs.unprivileged-qualification.outputs.build_number }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          echo "Verifying draft release exists for ${TAG}..."
          RELEASE_INFO="$(gh release view "${TAG}" --json isDraft,tagName 2>/dev/null || echo "")"
          if [ -z "${RELEASE_INFO}" ]; then
            echo "ERROR: Release '${TAG}' does not exist on GitHub. Phase A (stage-draft) must be executed before Phase B." >&2
            exit 1
          fi

          mkdir -p dist/staged-assets
          echo "Downloading staged draft release assets..."
          gh release download "${TAG}" --dir dist/staged-assets

          ATTESTATION_FILE="dist/staged-assets/RELEASE_ATTESTATION.json"
          if [ ! -f "${ATTESTATION_FILE}" ]; then
            echo "ERROR: Mandatory RELEASE_ATTESTATION.json missing from draft release ${TAG}." >&2
            exit 1
          fi

          HEAD_COMMIT="$(git rev-parse HEAD)"

          python3 - "${ATTESTATION_FILE}" "${SPARKLE_PUBLIC_ED_KEY}" "${TAG}" "${HEAD_COMMIT}" "${SHORT_VERSION}" "${BUILD_NUM}" <<'PY' || exit 1
          import json, sys, os, hashlib, subprocess

          att_file, expected_pub, expected_tag, head_commit, expected_ver, expected_build = sys.argv[1:7]
          with open(att_file) as f:
              att = json.load(f)

          if att.get("tag") != expected_tag:
              print(f"ERROR: Attestation tag mismatch: expected {expected_tag}, got {att.get('tag')}", file=sys.stderr)
              sys.exit(1)

          if att.get("commit_sha") != head_commit:
              print(f"ERROR: Attestation commit_sha mismatch: expected {head_commit}, got {att.get('commit_sha')}", file=sys.stderr)
              sys.exit(1)

          if att.get("short_version") != expected_ver:
              print(f"ERROR: Attestation short_version mismatch: expected {expected_ver}, got {att.get('short_version')}", file=sys.stderr)
              sys.exit(1)

          if str(att.get("build_number")) != str(expected_build):
              print(f"ERROR: Attestation build_number mismatch: expected {expected_build}, got {att.get('build_number')}", file=sys.stderr)
              sys.exit(1)

          if att.get("bundle_id") != "pool.sentineldefensetechnologies.co.za":
              print(f"ERROR: Attestation bundle_id mismatch: got {att.get('bundle_id')}", file=sys.stderr)
              sys.exit(1)

          if att.get("team_id") != "S8QMQZA656":
              print(f"ERROR: Attestation team_id mismatch: got {att.get('team_id')}", file=sys.stderr)
              sys.exit(1)

          if att.get("notary_status") != "Accepted":
              print(f"ERROR: Attestation notary_status is not Accepted: got {att.get('notary_status')}", file=sys.stderr)
              sys.exit(1)

          if att.get("stapled") is not True:
              print(f"ERROR: Attestation stapled is not True", file=sys.stderr)
              sys.exit(1)

          dmg_name = att.get("dmg_filename")
          dmg_path = os.path.join("dist/staged-assets", dmg_name)
          if not os.path.isfile(dmg_path):
              print(f"ERROR: DMG asset '{dmg_name}' missing from downloaded draft assets.", file=sys.stderr)
              sys.exit(1)

          actual_len = os.path.getsize(dmg_path)
          if actual_len != att.get("dmg_length"):
              print(f"ERROR: DMG byte length mismatch: expected {att.get('dmg_length')}, got {actual_len}", file=sys.stderr)
              sys.exit(1)

          with open(dmg_path, "rb") as f:
              actual_sha = hashlib.sha256(f.read()).hexdigest()
          if actual_sha != att.get("dmg_sha256"):
              print(f"ERROR: DMG SHA256 mismatch: expected {att.get('dmg_sha256')}, got {actual_sha}", file=sys.stderr)
              sys.exit(1)

          if att.get("sparkle_public_ed_key") != expected_pub:
              print(f"ERROR: Attestation public key mismatch: expected {expected_pub}, got {att.get('sparkle_public_ed_key')}", file=sys.stderr)
              sys.exit(1)

          # Verify machine-readable public signature sidecar matches attestation (WO-122-R3)
          sig_sidecar_path = "dist/staged-assets/SPARKLE_SIGNATURE.base64"
          if not os.path.isfile(sig_sidecar_path):
              print(f"ERROR: Machine-readable signature sidecar '{sig_sidecar_path}' missing from draft release assets.", file=sys.stderr)
              sys.exit(1)
          with open(sig_sidecar_path) as sf:
              sidecar_sig = sf.read().strip()
          if sidecar_sig != att.get("sparkle_ed_signature"):
              print(f"ERROR: Sidecar signature mismatch: sidecar='{sidecar_sig}', attestation='{att.get('sparkle_ed_signature')}'", file=sys.stderr)
              sys.exit(1)

          # Verify Ed25519 signature of DMG bytes against public key using Swift CryptoKit
          swift_verify = f"""
          import Foundation
          import CryptoKit

          guard let pubData = Data(base64Encoded: "{expected_pub}"),
                let sigData = Data(base64Encoded: "{att.get('sparkle_ed_signature')}"),
                let fileData = try? Data(contentsOf: URL(fileURLWithPath: "{dmg_path}")) else {{
              exit(1)
          }}
          guard let pubKey = try? Curve25519.Signing.PublicKey(rawRepresentation: pubData),
                pubKey.isValidSignature(sigData, for: fileData) else {{
              exit(2)
          }}
          """
          res = subprocess.run(["swift", "-e", swift_verify], capture_output=True)
          if res.returncode != 0:
              print(f"ERROR: Ed25519 cryptographic signature verification failed for {dmg_name}", file=sys.stderr)
              sys.exit(1)

          print(f"✓ Verified immutable draft attestation: tag {expected_tag}, commit {head_commit}, SHA256 ({actual_sha}), and EdDSA signature for {dmg_name}.")
          PY

          # Mount DMG read-only to verify app bundle, code signature, TeamID, Gatekeeper, Stapler
          DMG_PATH="$(ls -1 dist/staged-assets/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          MOUNT_PT="/Volumes/SentinelNodeWalletStaging"
          mkdir -p "${MOUNT_PT}"
          hdiutil attach -readonly -nobrowse -mountpoint "${MOUNT_PT}" "${DMG_PATH}"
          APP_PATH="${MOUNT_PT}/Sentinel Node Wallet.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "ERROR: Sentinel Node Wallet.app not found inside mounted candidate DMG." >&2
            hdiutil detach "${MOUNT_PT}" -force 2>/dev/null || true
            exit 1
          fi

          echo "Verifying code signature and TeamID..."
          codesign --verify --deep --strict "${APP_PATH}"
          codesign -dvvv "${APP_PATH}" 2>&1 | grep "TeamIdentifier=S8QMQZA656"

          echo "Verifying Gatekeeper assessment..."
          spctl -a -t exec -vv "${APP_PATH}"

          echo "Verifying notarization ticket..."
          xcrun stapler validate "${DMG_PATH}"

          echo "Verifying embedded SUPublicEDKey in Info.plist..."
          INFO_PLIST="${APP_PATH}/Contents/Info.plist"
          EMBEDDED_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "${INFO_PLIST}" 2>/dev/null || echo "")"
          if [ "${EMBEDDED_KEY}" != "${SPARKLE_PUBLIC_ED_KEY}" ]; then
            echo "ERROR: Embedded SUPublicEDKey ('${EMBEDDED_KEY}') does not match expected public key ('${SPARKLE_PUBLIC_ED_KEY}')." >&2
            hdiutil detach "${MOUNT_PT}" -force 2>/dev/null || true
            exit 1
          fi
          echo "✓ Verified embedded SUPublicEDKey matches expected public key."

          hdiutil detach "${MOUNT_PT}" -force 2>/dev/null || true
          echo "✓ Read-only DMG inspection, Gatekeeper, Notary, and SUPublicEDKey verification complete."

      # Step 2: Validate Sparkle Feed in Preflight Mode Prior to Promotion (WO-117, WO-120)
      - name: Validate Candidate Appcast Feed (Pre-Promotion Preflight Gating)
        env:
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          DMG_PATH="$(ls -1 dist/staged-assets/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          ED_SIG="$(python3 -c "import json; print(json.load(open('dist/staged-assets/RELEASE_ATTESTATION.json')).get('sparkle_ed_signature'))")"
          bash scripts/publish_production_appcast.sh \
            --tag "${TAG}" \
            --archive "${DMG_PATH}" \
            --signature "${ED_SIG}" \
            --public-key "${SPARKLE_PUBLIC_ED_KEY}" \
            --prune-unsigned-legacy \
            --preflight
          echo "✓ Pre-promotion preflight validation succeeded (WO-120): Live feed publish prerequisites and binary verifiers satisfied before public promotion."

      # Step 3: Promote Verified Draft Release to Public (WO-115, WO-117)
      - name: Promote Draft Release to Public
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
        run: |
          echo "Promoting verified draft release ${TAG} to public..."
          gh release edit "${TAG}" --draft=false
          echo "✓ Release ${TAG} promoted to public."

      # Step 4: Stage Sparkle Production Appcast Feed for PR Review (WO-118, WO-122-R1)
      - name: Stage Candidate Production Appcast Feed to Feed Branch
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          OPERATOR_APPROVAL: "${{ github.event.inputs.operator_approval_confirmed }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          DMG_PATH="$(ls -1 dist/staged-assets/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          ED_SIG="$(python3 -c "import json; print(json.load(open('dist/staged-assets/RELEASE_ATTESTATION.json')).get('sparkle_ed_signature'))")"
          bash scripts/publish_production_appcast.sh \
            --tag "${TAG}" \
            --archive "${DMG_PATH}" \
            --signature "${ED_SIG}" \
            --public-key "${SPARKLE_PUBLIC_ED_KEY}" \
            --operator-approval "${OPERATOR_APPROVAL}" \
            --stage-feed-branch \
            --prune-unsigned-legacy
          echo "✓ Candidate appcast feed staged to feed/${TAG} branch (WO-122-R1). Awaiting operator PR review and merge to main."

      # Step 5: Output Release Status Summary (WO-122-R2)
      - name: Output Release Status Summary
        run: |
          echo "### Release Status: SIGNED_RELEASE_PUBLIC_FEED_PR_PENDING" >> $GITHUB_STEP_SUMMARY
          echo "The GitHub Release **${{ needs.unprivileged-qualification.outputs.verified_tag }}** is now PUBLIC." >> $GITHUB_STEP_SUMMARY
          echo "Candidate Sparkle appcast has been staged to branch **feed/${{ needs.unprivileged-qualification.outputs.verified_tag }}**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Operator Actions Required to Complete Live Deployment:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review and merge Pull Request from \`feed/${{ needs.unprivileged-qualification.outputs.verified_tag }}\` into \`main\`." >> $GITHUB_STEP_SUMMARY
          echo "2. Re-dispatch this workflow with \`release_phase: verify-deployed\` to verify live CDN readback fail-closed." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Phase C: Post-Merge Live Deployed Feed Verification (WO-122-R2)
  # =========================================================================
  verify-deployed-feed:
    name: "Phase C: Post-Merge Live Deployed Feed Verification (WO-122-R2)"
    needs: unprivileged-qualification
    if: needs.unprivileged-qualification.outputs.effective_phase == 'verify-deployed'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unprivileged-qualification.outputs.verified_tag }}
          fetch-depth: 0

      - name: Download Staged Release Assets and Verify Deployed Feed
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          echo "Downloading public release assets for ${TAG}..."
          mkdir -p dist/staged-assets
          gh release download "${TAG}" --dir dist/staged-assets

          DMG_PATH="$(ls -1 dist/staged-assets/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          ED_SIG="$(python3 -c "import json; print(json.load(open('dist/staged-assets/RELEASE_ATTESTATION.json')).get('sparkle_ed_signature'))")"

          echo "Verifying deployed feed on main via CDN readback (fail-closed, WO-122-R2)..."
          bash scripts/publish_production_appcast.sh \
            --tag "${TAG}" \
            --archive "${DMG_PATH}" \
            --signature "${ED_SIG}" \
            --public-key "${SPARKLE_PUBLIC_ED_KEY}" \
            --verify-deployed-feed
