name: macOS Production Release & Sparkle Deployment

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git release tag to publish (e.g. v1.0.0-build5)'
        required: true
        type: string
      operator_approval_confirmed:
        description: 'Explicit human operator release approval confirmation (type YES to confirm)'
        required: true
        type: string
        default: 'NO'
      release_phase:
        description: 'Release Phase: "stage-draft" (Phase A: Build, sign, notarize, stage draft release) or "promote-feed" (Phase B: Promote draft to public, publish feed)'
        required: true
        type: choice
        default: 'stage-draft'
        options:
          - 'stage-draft'
          - 'promote-feed'
      is_draft:
        description: 'Legacy parameter: set true for stage-draft, false for promote-feed'
        required: false
        type: boolean
        default: true
      is_prerelease:
        description: 'Publish release as a Pre-release (Beta channel)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release-macos
  cancel-in-progress: false

jobs:
  unprivileged-qualification:
    name: Unprivileged Build Qualification & Gating
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verified_tag: ${{ steps.validate_tag.outputs.verified_tag }}
      short_version: ${{ steps.validate_tag.outputs.short_version }}
      build_number: ${{ steps.validate_tag.outputs.build_number }}
      effective_phase: ${{ steps.validate_tag.outputs.effective_phase }}
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0

      - name: Display Swift toolchain
        run: swift --version

      # Gating Stage 1: Validate Release Tag and Operator Release Authorization (Fail-Closed)
      - name: Validate Release Tag and Operator Release Authorization
        id: validate_tag
        env:
          INPUT_TAG: "${{ github.event.inputs.tag_name }}"
          OPERATOR_APPROVAL: "${{ github.event.inputs.operator_approval_confirmed }}"
          INPUT_PHASE: "${{ github.event.inputs.release_phase }}"
          IS_DRAFT_INPUT: "${{ github.event.inputs.is_draft }}"
        run: |
          if [ "${OPERATOR_APPROVAL}" != "YES" ]; then
            echo "ERROR: Operator release authorization missing or invalid. Received '${OPERATOR_APPROVAL}', expected 'YES'." >&2
            exit 1
          fi

          if [ -z "${INPUT_TAG}" ]; then
            echo "ERROR: Target release tag cannot be empty." >&2
            exit 1
          fi

          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$'
          if ! [[ "${INPUT_TAG}" =~ ${TAG_REGEX} ]]; then
            echo "ERROR: Release tag '${INPUT_TAG}' does not match required format: ^v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$" >&2
            exit 1
          fi

          VERSION="${INPUT_TAG#v}"
          VERSION="${VERSION%%-build*}"
          BUILD_NUM="${INPUT_TAG##*-build}"

          if [ "${BUILD_NUM}" -le 3 ]; then
            echo "ERROR: Build number ${BUILD_NUM} must be greater than 3 to maintain monotonic sequence (Build 3 is published)." >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${INPUT_TAG}" 2>/dev/null || echo "")"
          if [ -z "${TAG_COMMIT}" ]; then
            echo "ERROR: Release tag '${INPUT_TAG}' does not exist in repository git history." >&2
            exit 1
          fi

          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "ERROR: Target tag commit (${TAG_COMMIT}) does not match current HEAD commit (${HEAD_COMMIT})." >&2
            exit 1
          fi

          EFFECTIVE_PHASE="${INPUT_PHASE}"
          if [ -z "${EFFECTIVE_PHASE}" ]; then
            if [ "${IS_DRAFT_INPUT}" = "false" ]; then
              EFFECTIVE_PHASE="promote-feed"
            else
              EFFECTIVE_PHASE="stage-draft"
            fi
          fi

          echo "verified_tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "effective_phase=${EFFECTIVE_PHASE}" >> "$GITHUB_OUTPUT"
          echo "Operator release approval and tag validation passed: ${INPUT_TAG} (v${VERSION} build ${BUILD_NUM}) [Phase: ${EFFECTIVE_PHASE}] -> ${HEAD_COMMIT}"

      # Gating Stage 2: Full Automated Test Suite
      - name: Run native unit tests
        run: swift test

      # Gating Stage 3: Verify Release Broadcast Lock & Purge Safety (WO-25, WO-39, WO-44, WO-59)
      - name: Verify release broadcast lock and spend gate enforcement
        run: swift run -c release VerifyReleaseBroadcastLock

      # Gating Stage 4: Packaging Shell Syntax Validation
      - name: Validate script syntax
        run: |
          bash -n scripts/build_app.sh \
                  scripts/build_dmg.sh \
                  scripts/build_production_dmg.sh \
                  scripts/sign_appcast_enclosure.sh \
                  scripts/publish_production_appcast.sh \
                  scripts/fetch-verify-knots.sh \
                  scripts/package_appstore_archive.sh

      # Gating Stage 5: Verify Bitcoin Knots Binary Provenance
      - name: Cache & verify official Bitcoin Knots binaries
        run: bash scripts/fetch-verify-knots.sh

  # =========================================================================
  # Phase A: Privileged Signing, Notarization & Draft Release Staging (WO-115)
  # =========================================================================
  stage-candidate-draft:
    name: Phase A: Privileged Signing, Notarization & Draft Release Staging (WO-115)
    needs: unprivileged-qualification
    if: needs.unprivileged-qualification.outputs.effective_phase == 'stage-draft'
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unprivileged-qualification.outputs.verified_tag }}
          fetch-depth: 0

      # Gating Stage 6: Environment & Secrets Verification (Fail-Closed)
      - name: Verify production signing prerequisites (Fail-Closed)
        env:
          APPLE_CERT_B64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
          APPLE_CERT_PASS: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
          NOTARY_KEY_B64: "${{ secrets.NOTARY_API_KEY_BASE64 }}"
          NOTARY_KEY_ID: "${{ secrets.NOTARY_KEY_ID }}"
          NOTARY_ISSUER_ID: "${{ secrets.NOTARY_ISSUER_ID }}"
          SPARKLE_PRIV_KEY: "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}"
          SPARKLE_PUB_KEY: "${{ secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          MISSING=""
          if [ -z "${APPLE_CERT_B64}" ] || [ -z "${APPLE_CERT_PASS}" ]; then
            MISSING="${MISSING} APPLE_CERTIFICATE"
          fi
          if [ -z "${NOTARY_KEY_B64}" ] || [ -z "${NOTARY_KEY_ID}" ] || [ -z "${NOTARY_ISSUER_ID}" ]; then
            MISSING="${MISSING} NOTARY_CREDENTIALS"
          fi
          if [ -z "${SPARKLE_PRIV_KEY}" ] || [ -z "${SPARKLE_PUB_KEY}" ]; then
            MISSING="${MISSING} SPARKLE_KEYS"
          fi

          if [ -n "${MISSING}" ]; then
            echo "ERROR: Production release blocked fail-closed. Missing mandatory signing credentials:${MISSING}." >&2
            echo "Official production distribution requires an Apple Developer ID Application certificate, Apple Notary credentials, and Sparkle Ed25519 keypair." >&2
            exit 1
          fi

      # Configure Ephemeral Keychain for Developer ID Application
      - name: Configure ephemeral keychain and Developer ID identity
        env:
          CERT_BASE64: "${{ secrets.APPLE_CERTIFICATE_BASE64 }}"
          CERT_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          CERT_FILE="${RUNNER_TEMP}/cert.p12"
          echo "${CERT_BASE64}" | base64 --decode > "${CERT_FILE}"
          security import "${CERT_FILE}" -k "${KEYCHAIN_PATH}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          rm -f "${CERT_FILE}"

      # Configure Apple Notary Service Credentials
      - name: Configure Apple Notary credentials
        env:
          KEY_BASE64: "${{ secrets.NOTARY_API_KEY_BASE64 }}"
          KEY_ID: "${{ secrets.NOTARY_KEY_ID }}"
          ISSUER_ID: "${{ secrets.NOTARY_ISSUER_ID }}"
        run: |
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${KEY_ID}.p8"
          echo "${KEY_BASE64}" | base64 --decode > "${API_KEY_PATH}"
          xcrun notarytool store-credentials "sentinel-notary-profile" \
            --key "${API_KEY_PATH}" \
            --key-id "${KEY_ID}" \
            --issuer "${ISSUER_ID}"
          rm -f "${API_KEY_PATH}"

      # Production Build, Sign, and Notarize (Hardened Runtime, Developer ID, Staple)
      - name: Build, Sign, and Notarize Production DMG
        env:
          SENTINEL_RELEASE_SECURITY_APPROVED: "1"
          SENTINEL_BUNDLE_ID: pool.sentineldefensetechnologies.co.za
          SENTINEL_DEVELOPER_ID_APPLICATION: "${{ secrets.DEVELOPER_ID_APPLICATION_NAME || 'Developer ID Application: Peter Franco' }}"
          SENTINEL_APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID || 'S8QMQZA656' }}"
          SENTINEL_WEBCREDENTIALS_DOMAIN: pool.sentineldefensetechnologies.co.za
          SENTINEL_NOTARY_PROFILE: sentinel-notary-profile
          SPARKLE_PUBLIC_ED_KEY: "${{ secrets.SPARKLE_PUBLIC_ED_KEY }}"
          SENTINEL_REQUIRE_SPARKLE_KEY: "1"
          SENTINEL_SHORT_VERSION: "${{ needs.unprivileged-qualification.outputs.short_version }}"
          SENTINEL_BUILD_NUMBER: "${{ needs.unprivileged-qualification.outputs.build_number }}"
        run: |
          bash scripts/build_production_dmg.sh

      # Sparkle Signing & Appcast Enclosure Generation
      - name: Sign DMG with Sparkle EdDSA Key
        env:
          SPARKLE_PRIVATE_ED_KEY: "${{ secrets.SPARKLE_PRIVATE_ED_KEY }}"
        run: |
          DMG_FILE="$(ls -1 dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          bash scripts/sign_appcast_enclosure.sh sign "${DMG_FILE}" > dist/SPARKLE_ENCLOSURE.txt
          cat dist/SPARKLE_ENCLOSURE.txt

      # Release Asset Upload (Draft Staging Only, WO-108, WO-115)
      - name: Create Immutable Draft GitHub Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          IS_PRERELEASE: "${{ github.event.inputs.is_prerelease }}"
        run: |
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on GitHub. Skipping re-creation to maintain immutable asset provenance."
          else
            echo "Creating new draft release for ${TAG}..."
            gh release create "${TAG}" \
              dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg \
              dist/SHA256SUMS.txt \
              dist/BUILD_MANIFEST.json \
              --title "Sentinel Node Wallet (${TAG})" \
              --notes-file docs/RELEASE_NOTES_CANDIDATE.md \
              --draft ${PRERELEASE_FLAG}
          fi

      # Dry-Run Appcast Validation
      - name: Validate Sparkle Feed in Dry-Run Mode
        env:
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          DMG_FILE="$(ls -1 dist/Sentinel-Node-Wallet-*-macOS-arm64-notarized.dmg | head -n 1)"
          bash scripts/publish_production_appcast.sh \
            --tag "${TAG}" \
            --archive "${DMG_FILE}" \
            --app-bundle "dist/Sentinel Node Wallet.app" \
            --public-key "${SPARKLE_PUBLIC_ED_KEY}" \
            --dry-run
          echo "✓ Draft release staged. Public feed remains untouched until Phase B promotion."

      # Cleanup Credentials
      - name: Clean up ephemeral credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/AuthKey_"*.p8 2>/dev/null || true
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain"
          if [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          fi

  # =========================================================================
  # Phase B: Owner-Approved Public Release Promotion & Feed Cutover (WO-115)
  # =========================================================================
  promote-public-feed:
    name: Phase B: Owner-Approved Public Release Promotion & Feed Cutover (WO-115)
    needs: unprivileged-qualification
    if: needs.unprivileged-qualification.outputs.effective_phase == 'promote-feed'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository at candidate release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unprivileged-qualification.outputs.verified_tag }}
          fetch-depth: 0

      # Step 1: Promote Draft Release to Public (Immutable Asset Promotion)
      - name: Promote Draft Release to Public
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
        run: |
          echo "Verifying draft release exists for ${TAG}..."
          RELEASE_INFO="$(gh release view "${TAG}" --json isDraft,tagName 2>/dev/null || echo "")"
          if [ -z "${RELEASE_INFO}" ]; then
            echo "ERROR: Release '${TAG}' does not exist on GitHub. Phase A (stage-draft) must be executed before Phase B." >&2
            exit 1
          fi

          IS_DRAFT="$(echo "${RELEASE_INFO}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('isDraft', False))")"
          if [ "${IS_DRAFT}" = "True" ]; then
            echo "Promoting verified immutable draft release ${TAG} to public..."
            gh release edit "${TAG}" --draft=false
            echo "✓ Release ${TAG} promoted to public."
          else
            echo "Release ${TAG} is already public. Proceeding to feed publication (idempotent retry)."
          fi

      # Step 2: Publish Sparkle Production Appcast Feed with Mandatory Remote Verification & Legacy Pruning
      - name: Publish Sparkle Production Appcast Feed to Main
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.unprivileged-qualification.outputs.verified_tag }}"
          OPERATOR_APPROVAL: "${{ github.event.inputs.operator_approval_confirmed }}"
          SPARKLE_PUBLIC_ED_KEY: "${{ secrets.SPARKLE_PUBLIC_ED_KEY }}"
        run: |
          echo "Publishing live production Sparkle appcast to main with mandatory remote asset verification..."
          bash scripts/publish_production_appcast.sh \
            --tag "${TAG}" \
            --app-bundle "dist/Sentinel Node Wallet.app" \
            --public-key "${SPARKLE_PUBLIC_ED_KEY}" \
            --operator-approval "${OPERATOR_APPROVAL}" \
            --publish-to-main \
            --prune-unsigned-legacy
